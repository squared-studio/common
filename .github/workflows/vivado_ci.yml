name: Vivado_CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Vivado_CI:

    runs-on: [make, vivado]

    steps:
    - uses: actions/checkout@v4

    - name: Simulate
      shell: msys2 {0}
      run: |
        git submodule update --init --recursive --depth 1
        make CI

    - name: Fail if Simulation Contains Fails
      shell: msys2 {0}
      run: |
        [[ -s ___CI_ERROR ]] && exit 1 || exit 0
